{% extends 'base.html' %}
{% load i18n %}

{% block breadcrumb_items %}
<li class="breadcrumb-item"><a href="{% url 'account_login' %}">Вход</a></li>
<li class="breadcrumb-item"><a href="{% url 'account_reset_password' %}">Сброс пароля</a></li>
<li class="breadcrumb-item active" aria-current="page">Пароль изменён</li>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow" style="border: none; border-radius: 16px; overflow: hidden;">
                <div class="card-header" style="background-color: var(--accent); color: white; border: none; padding: 20px;">
                    <h1 class="mb-0 h4"><i class="fas fa-check-circle me-2" aria-hidden="true"></i> Пароль изменён</h1>
                </div>
                <div class="card-body" style="padding: 30px; text-align: center;">
                    <i class="fas fa-check-circle" style="font-size: 64px; color: #28a745; margin-bottom: 20px;" aria-hidden="true"></i>
                    <p class="text-secondary mb-4">Ваш пароль успешно изменён.</p>
                    <hr class="my-4">
                    <a href="{% url 'account_login' %}" class="btn w-100" style="background-color: var(--accent); color: white; border: none; border-radius: 12px; padding: 12px; font-weight: 600; text-decoration: none;" aria-label="Перейти на страницу входа">
                        <i class="fas fa-sign-in-alt me-2" aria-hidden="true"></i> Войти
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
