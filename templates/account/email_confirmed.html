{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center">
                <div class="card-header" style="background-color: var(--accent); color: white;">
                    <h1 class="mb-0 h4">Email подтверждён!</h1>
                </div>
                <div class="card-body">
                    <div aria-hidden="true">
                        <i class="fas fa-check-circle fa-4x mb-3" style="color: #28a745;"></i>
                    </div>
                    <h2 class="h5">Регистрация завершена</h2>
                    <p class="mt-3">
                        Ваш email успешно подтверждён. Теперь вы можете войти в свой аккаунт.
                    </p>
                    <a href="{% url 'account_login' %}" class="btn btn-gold mt-3" aria-label="Перейти на страницу входа">Войти</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
