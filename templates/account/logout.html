{% extends 'base.html' %}
{% load i18n %}

{% block breadcrumb_items %}
<li class="breadcrumb-item"><a href="{% url 'account_login' %}">Вход</a></li>
<li class="breadcrumb-item active" aria-current="page">Выход</li>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow" style="border: none; border-radius: 16px; overflow: hidden;">
                <div class="card-header" style="background-color: var(--accent); color: white; border: none; padding: 20px;">
                    <h1 class="mb-0 h4">
                        <i class="fas fa-sign-out-alt me-2" aria-hidden="true"></i> 
                        Выход из системы
                    </h1>
                </div>
                <div class="card-body" style="padding: 30px; text-align: center;">
                    <div aria-hidden="true">
                        <i class="fas fa-question-circle" style="font-size: 48px; color: var(--accent); margin-bottom: 20px;"></i>
                    </div>
                    <p class="text-secondary mb-4">Вы уверены, что хотите выйти из своей учётной записи?</p>
                    <form method="post" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn w-100" style="background-color: var(--accent); color: white; border: none; border-radius: 12px; padding: 12px; font-weight: 600;" aria-label="Подтвердить выход из аккаунта">
                            <i class="fas fa-sign-out-alt me-2" aria-hidden="true"></i> 
                            <span>Выйти</span>
                        </button>
                    </form>
                    <hr class="my-4">
                    <p class="text-center mb-0">
                        <a href="{% url 'home' %}" style="color: var(--accent); text-decoration: none;" aria-label="Вернуться на главную страницу">
                            <i class="fas fa-arrow-left me-1" aria-hidden="true"></i> 
                            <span>Вернуться на главную</span>
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
