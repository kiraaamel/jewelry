{% extends 'base.html' %}
{% load i18n %}

{% block breadcrumb_items %}
<li class="breadcrumb-item"><a href="{% url 'account_login' %}">Вход</a></li>
<li class="breadcrumb-item active" aria-current="page">Выход</li>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow" style="border: none; border-radius: 16px; overflow: hidden;">
                <div class="card-header" style="background-color: var(--accent); color: white; border: none; padding: 20px;">
                    <h4 class="mb-0"><i class="fas fa-sign-out-alt me-2"></i> Выход из системы</h4>
                </div>
                <div class="card-body" style="padding: 30px; text-align: center;">
                    <i class="fas fa-question-circle" style="font-size: 48px; color: var(--accent); margin-bottom: 20px;"></i>
                    <p class="text-secondary mb-4">Вы уверены, что хотите выйти из своей учетной записи?</p>
                    <form method="post" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn w-100" style="background-color: var(--accent); color: white; border: none; border-radius: 12px; padding: 12px; font-weight: 600;">
                            <i class="fas fa-sign-out-alt me-2"></i> Выйти
                        </button>
                    </form>
                    <hr class="my-4">
                    <p class="text-center mb-0">
                        <a href="{% url 'home' %}" style="color: var(--accent); text-decoration: none;">
                            <i class="fas fa-arrow-left me-1"></i> Вернуться на главную
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
