{% extends 'base.html' %}
{% load static %}

{% block breadcrumb_items %}
<li class="breadcrumb-item active" aria-current="page">Каталог</li>
{% endblock %}

{% block content %}
<style>
    .filter-section {
        background: white;
        border-radius: 1rem;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        position: sticky;
        top: 1.25rem;
    }
    
    .filter-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 0.9375rem;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid var(--accent);
    }
    
    .filter-group {
        margin-bottom: 1.25rem;
    }
    
    .filter-label {
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--brown);
        margin-bottom: 0.5rem;
        display: block;
    }
    
    .filter-select {
        width: 100%;
        padding: 0.625rem 0.75rem;
        border: 1px solid #ddd;
        border-radius: 0.75rem;
        font-size: 0.8125rem;
        background: white;
        color: var(--brown);
        cursor: pointer;
    }
    
    .filter-select:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .price-inputs {
        display: flex;
        gap: 0.625rem;
        width: 100%;
    }
    
    .price-inputs input {
        flex: 1;
        padding: 0.625rem 0.75rem;
        border: 1px solid #ddd;
        border-radius: 0.75rem;
        font-size: 0.8125rem;
        min-width: 0;
    }
    
    .price-inputs input:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .btn-apply {
        background: var(--gray);
        color: white;
        border: none;
        padding: 0.75rem 1.25rem;
        border-radius: 1.875rem;
        font-size: 0.875rem;
        cursor: pointer;
        width: 100%;
        margin-top: 0.625rem;
        transition: all 0.3s;
    }
    
    .btn-apply:hover {
        background: #4a5a6a;
        transform: translateY(-2px);
    }
    
    .btn-apply:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .btn-reset {
        background: transparent;
        border: 1px solid var(--gray);
        color: var(--gray);
        padding: 0.625rem 1.25rem;
        border-radius: 1.875rem;
        font-size: 0.875rem;
        cursor: pointer;
        width: 100%;
        margin-top: 0.5rem;
        transition: all 0.3s;
    }
    
    .btn-reset:hover {
        background: var(--accent);
        color: white;
    }
    
    .btn-reset:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .products-count {
        font-size: 0.875rem;
        color: var(--gray);
        margin-bottom: 0.9375rem;
    }
    
    .sort-select {
        padding: 0.625rem 1.25rem;
        border: 1px solid var(--brown);
        border-radius: 1.875rem;
        font-size: 0.8125rem;
        background: white;
        cursor: pointer;
    }
    
    .sort-select:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }

    .product-card {
        background: white;
        border-radius: 1.25rem;
        overflow: hidden;
        box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        transition: transform 0.3s, box-shadow 0.3s;
        height: 100%;
        position: relative;
    }
    
    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    
    .product-card:focus-within {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .product-image-wrapper {
        position: relative;
    }
    
    .product-image {
        height: 200px;
        object-fit: cover;
        width: 100%;
    }
    
    .favorite-icon-btn {
        position: absolute;
        top: 0.625rem;
        right: 0.625rem;
        background: rgba(0, 0, 0, 0.175);
        border: none;
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s;
        backdrop-filter: blur(4px);
        z-index: 10;
    }
    
    .favorite-icon-btn:hover {
        transform: scale(1.1);
        background: rgba(0,0,0,0.7);
    }
    
    .favorite-icon-btn:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .favorite-icon-btn i {
        font-size: 1.125rem;
    }
    
    .discount-badge {
        position: absolute;
        top: 0.625rem;
        left: 0.625rem;
        background: var(--brown);
        color: var(--bg-cream);
        padding: 0.25rem 0.625rem;
        border-radius: 1.25rem;
        font-size: 0.6875rem;
        font-weight: bold;
        z-index: 10;
    }
    
    .product-info {
        padding: 0.9375rem;
    }
    
    .product-info a {
        text-decoration: none !important;
        color: inherit;
    }
    
    .product-category {
        font-size: 0.6875rem;
        color: var(--gray);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .product-name {
        font-size: 1rem;
        font-weight: 600;
        color: var(--brown);
        margin: 0.5rem 0;
    }
    
    .product-price {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--accent);
        margin: 0.625rem 0;
    }
    
    .old-price {
        font-size: 0.8125rem;
        color: var(--gray);
        text-decoration: line-through;
        margin-left: 0.5rem;
        font-weight: normal;
    }
    
    .rating {
        margin: 0.5rem 0;
    }
    
    .rating-stars {
        color: #ffc107;
        font-size: 0.75rem;
    }
    
    .product-sizes {
        font-size: 0.6875rem;
        color: var(--gray);
        margin: 0.5rem 0;
    }
    
    .btn-cart {
        width: 100%;
        padding: 0.625rem;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 1.875rem;
        font-size: 0.8125rem;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 0.625rem;
    }
    
    .btn-cart:hover:not(.disabled) {
        background: #4a5a6a;
        transform: translateY(-2px);
    }
    
    .btn-cart:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .btn-cart.disabled {
        opacity: 0.5;
        cursor: not-allowed;
        pointer-events: none;
    }

    .pagination {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 1.875rem;
        flex-wrap: wrap;
    }
    
    .page-link {
        padding: 0.5rem 0.875rem;
        border: 1px solid #ddd;
        border-radius: 1.875rem;
        color: var(--brown);
        text-decoration: none;
        font-size: 0.8125rem;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .page-link:hover {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }
    
    .page-link:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .page-link.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }
    
    .page-link.disabled {
        color: var(--gray);
        cursor: not-allowed;
        pointer-events: none;
        background: transparent;
    }
    
    .btn-clear-search {
        background: var(--accent);
        color: white;
        border: none;
        padding: 0.625rem 1.25rem;
        border-radius: 1.875rem;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .btn-clear-search:hover {
        background: #4a5a6a;
        transform: translateY(-2px);
    }
    
    .btn-clear-search:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }

    @media (max-width: 992px) {
        .filter-section {
            position: static;
            margin-bottom: 1rem;
        }
        
        .product-image {
            height: 150px !important;
        }
    }
 
    @media (max-width: 768px) {
        .filter-section {
            padding: 1rem;
        }
        
        .filter-title {
            font-size: 1rem;
        }
        
        .product-image {
            height: 200px;
        }
        
        .product-name {
            font-size: 0.875rem;
        }
        
        .product-price {
            font-size: 1rem;
        }
        
        .btn-cart,
        .btn-apply,
        .btn-reset {
            font-size: 0.75rem;
        }
    }
    
    @media (max-width: 576px) {
        .filter-section {
            position: static;
            margin-bottom: 1rem;
            cursor: pointer;
        }
        
        .filter-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 0;
        }
        
        .filter-title::after {
            content: "▼";
            font-size: 0.75rem;
            transition: transform 0.3s;
        }
        
        .filter-title.open::after {
            transform: rotate(180deg);
        }
        
        .filter-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .filter-content.open {
            max-height: 500px;
        }
        
        .filter-group {
            margin-bottom: 0;
        }
        .products-count {
            font-size: 0.75rem;
        }
        
        .sort-select {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
        }
        
        .product-image {
            height: 180px;
        }
        
        .product-info {
            padding: 0.75rem;
        }
        
        .product-name {
            font-size: 0.8125rem;
            margin: 0.375rem 0;
        }
        
        .product-category {
            font-size: 0.625rem;
        }
        
        .product-price {
            font-size: 0.9375rem;
            margin: 0.5rem 0;
        }
        
        .rating-stars {
            font-size: 0.6875rem;
        }
        
        .product-sizes {
            font-size: 0.8rem;
        }
        
        .btn-cart {
            padding: 0.5rem;
            font-size: 1rem;
        }
        
        .favorite-icon-btn {
            width: 1.875rem;
            height: 1.875rem;
        }
        
        .favorite-icon-btn i {
            font-size: 0.875rem;
        }
        
        .discount-badge {
            font-size: 0.9rem;
            padding: 0.1875rem 0.5rem;
        }
        
        .page-link {
            padding: 0.375rem 0.625rem;
            font-size: 0.75rem;
        }
        
        .btn-clear-search {
            padding: 0.5rem 0.875rem;
            font-size: 0.75rem;
        }
    }

    @media (max-width: 426px) {
        .product-image {
            height: 160px;
        }
        
        .product-name {
            font-size: 1.1rem;
        }
        
        .product-price {
            font-size: 1rem;
        }
        
        .product-category {
            font-size: 0.7rem;
        }
    }
    
    @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
</style>
<div class="container py-4">
    <div class="row">
        <aside class="col-md-3" aria-label="Фильтры товаров">
            <div class="filter-section">
                <h2 class="filter-title" id="filter-title">Фильтры</h2>
                
                <div class="filter-group">
                    <label id="collection-label" for="filter-collection" class="filter-label">Коллекция</label>
                    <select id="filter-collection" class="filter-select" aria-labelledby="collection-label">
                        <option value="">Все коллекции</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label id="category-label" for="filter-category" class="filter-label">Категория</label>
                    <select id="filter-category" class="filter-select" aria-labelledby="category-label">
                        <option value="">Все категории</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label id="silver-type-label" for="filter-silver-type" class="filter-label">Тип серебра</label>
                    <select id="filter-silver-type" class="filter-select" aria-labelledby="silver-type-label">
                        <option value="">Все типы</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label id="fineness-label" for="filter-fineness" class="filter-label">Проба</label>
                    <select id="filter-fineness" class="filter-select" aria-labelledby="fineness-label">
                        <option value="">Все пробы</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <fieldset>
                        <legend class="filter-label" id="price-legend">Цена (₽)</legend>
                        <div class="price-inputs">
                            <input type="number" id="price-min" placeholder="От" aria-label="Минимальная цена" aria-describedby="price-legend">
                            <input type="number" id="price-max" placeholder="До" aria-label="Максимальная цена" aria-describedby="price-legend">
                        </div>
                    </fieldset>
                </div>
                
                <div class="filter-group">
                    <label id="stones-label" for="filter-stones" class="filter-label">Камни</label>
                    <select id="filter-stones" class="filter-select" aria-labelledby="stones-label">
                        <option value="">Все</option>
                        <option value="true">С камнями</option>
                        <option value="false">Без камней</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label id="stone-type-label" for="filter-stone-type" class="filter-label">Тип камня</label>
                    <select id="filter-stone-type" class="filter-select" aria-labelledby="stone-type-label">
                        <option value="">Любой</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label id="discount-label" for="filter-discount" class="filter-label">Акция</label>
                    <select id="filter-discount" class="filter-select" aria-labelledby="discount-label">
                        <option value="">Все товары</option>
                        <option value="true">Со скидкой</option>
                    </select>
                </div>
                
                <button class="btn-apply" id="apply-filters" aria-label="Применить выбранные фильтры">Применить</button>
                <button class="btn-reset" id="reset-filters" aria-label="Сбросить все фильтры">Сбросить</button>
            </div>
        </aside>
        
        <main class="col-md-9" aria-label="Список товаров">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <div class="products-count" id="products-count" aria-live="polite">Загрузка...</div>
                <div>
                    <label class="visually-hidden" for="sort-select">Сортировка товаров</label>
                    <select class="sort-select" id="sort-select" aria-label="Сортировка товаров">
                        <option value="-created_at">По новизне</option>
                        <option value="price">Цена (по возрастанию)</option>
                        <option value="-price">Цена (по убыванию)</option>
                        <option value="-average_rating">По популярности</option>
                    </select>
                </div>
                <button id="clear-search" class="btn-clear-search" style="display: none;" aria-label="Очистить поиск">
                    <i class="fas fa-times" aria-hidden="true"></i> <span>Очистить поиск</span>
                </button>
            </div>
            
            <div class="row" id="products-container" role="list" aria-label="Товары">
                <div class="col-12 text-center py-5 text-secondary">
                    <div class="spinner-border" style="color: var(--accent);" role="status" aria-label="Загрузка">
                        <span class="visually-hidden">Загрузка товаров...</span>
                    </div>
                </div>
            </div>
            
            <nav id="pagination" class="pagination" aria-label="Пагинация"></nav>
        </main>
    </div>
</div>

<!-- Модальное окно выбора размера -->
<div id="size-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="size-modal-title">
    <div class="modal-content">
        <button class="modal-close" onclick="closeSizeModal()" aria-label="Закрыть окно выбора размера">&times;</button>
        <h3 id="size-modal-title" style="margin-bottom:1.25rem; color:var(--accent);">Выберите размер</h3>
        <div id="size-options" class="size-buttons" role="group" aria-label="Доступные размеры"></div>
        <div id="stock-info" style="margin: 0.625rem 0; font-size: 0.75rem;" aria-live="polite"></div>
        <div>
            <label id="quantity-label" for="modal-quantity">Количество:</label>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;">
                <button type="button" id="size-qty-minus" aria-label="Уменьшить количество на 1" style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--accent); background: white; cursor: pointer;">-</button>
                <input type="number" id="modal-quantity" value="1" min="1" step="1" 
                    style="width: 80px; padding: 8px; text-align: center; border: 1px solid #ddd; border-radius: 8px;" 
                    aria-label="Количество товара" aria-describedby="quantity-label">
                <button type="button" id="size-qty-plus" aria-label="Увеличить количество на 1" style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--accent); background: white; cursor: pointer;">+</button>
            </div>
        </div>
        <button id="confirm-add-to-cart" class="btn-modal-confirm" aria-label="Подтвердить добавление в корзину">
            Добавить в корзину
        </button>
        <button onclick="closeSizeModal()" class="btn-modal-cancel" aria-label="Отменить добавление">
            Отмена
        </button>
    </div>
</div>

<!-- Модальное окно выбора количества для товаров без размера -->
<div id="quantity-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="quantity-modal-title">
    <div class="modal-content">
        <button class="modal-close" onclick="closeQuantityModal()" aria-label="Закрыть окно выбора количества">&times;</button>
        <h3 id="quantity-modal-title" style="margin-bottom:20px; color:var(--accent);">Выберите количество</h3>
        <div id="qty-stock-info" style="margin: 10px 0; font-size: 12px;" aria-live="polite"></div>
        <div>
            <label id="qty-label" for="modal-qty-value">Количество:</label>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;">
                <button id="qty-minus" aria-label="Уменьшить количество на 1" style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--accent); background: white; cursor: pointer;">-</button>
                <input type="number" id="modal-qty-value" value="1" min="1" style="width: 80px; padding: 8px; text-align: center; border: 1px solid #ddd; border-radius: 8px;" aria-label="Количество товара" aria-describedby="qty-label">
                <button id="qty-plus" aria-label="Увеличить количество на 1" style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--accent); background: white; cursor: pointer;">+</button>
            </div>
        </div>
        <button id="confirm-add-to-cart-qty" style="margin-top:20px; padding:12px 24px; background:var(--accent); color:white; border:none; border-radius:30px; cursor:pointer;" aria-label="Подтвердить добавление в корзину">Добавить в корзину</button>
        <button onclick="closeQuantityModal()" style="margin-top:10px; padding:8px 20px; background:transparent; border:none; cursor:pointer;" aria-label="Отменить добавление">Отмена</button>
    </div>
</div>

<style>
    .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    
    .modal.active {
        display: flex;
    }
    
    .modal-content {
        background: white;
        border-radius: 1.5rem;
        padding: 1.875rem;
        max-width: 350px;
        width: 90%;
        text-align: center;
        position: relative;
    }
    
    .modal-close {
        position: absolute;
        top: 0.9375rem;
        right: 1.25rem;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--gray);
        background: none;
        border: none;
    }
    
    .modal-close:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .size-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.625rem;
        justify-content: center;
        margin: 1.25rem 0;
    }
    
    .size-btn {
        padding: 0.625rem 1.25rem;
        border: 1px solid var(--accent);
        border-radius: 1.875rem;
        background: white;
        cursor: pointer;
    }
    
    .size-btn:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .size-btn.selected {
        background: var(--accent);
        color: white;
    }
    
    .btn-modal-confirm {
        margin-top: 1.25rem;
        padding: 0.75rem 1.5rem;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 1.875rem;
        cursor: pointer;
    }
    
    .btn-modal-confirm:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .btn-modal-cancel {
        margin-top: 0.625rem;
        padding: 0.5rem 1.25rem;
        background: transparent;
        border: none;
        cursor: pointer;
    }
    
    .btn-modal-cancel:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .notification {
        position: fixed;
        bottom: 1.25rem;
        right: 1.25rem;
        background: var(--accent);
        color: var(--bg-cream);
        padding: 0.75rem 1.5rem;
        border-radius: 1.875rem;

{% block scripts %}
<script>
let currentPage = 1;
let totalPages = 1;
let selectedProductId = null;
let selectedProductSizes = [];
let selectedSize = null;
let currentFavorites = [];
let currentCollectionSlug = null;
let selectedAvailableQty = 0;
let silverTypes = [];
let finenessChoices = [];
let stoneTypeChoices = [];

let sizeModalProductId = null;
let sizeModalVariants = [];
let sizeModalSelectedVariant = null;

let sizeModalSizes = [];
let sizeModalSelectedSize = null;
let sizeModalAvailableQty = 0;
let sizeModalCurrentInCart = 0;

let urlParams = new URLSearchParams(window.location.search);
const collectionSlug = urlParams.get('collection');
const searchQuery = urlParams.get('search');

if (searchQuery) {
    const clearBtn = document.getElementById('clear-search');
    if (clearBtn) clearBtn.style.display = 'block';
}

const clearSearchBtn = document.getElementById('clear-search');
if (clearSearchBtn) {
    clearSearchBtn.addEventListener('click', () => {
        const url = new URL(window.location.href);
        url.searchParams.delete('search');
        window.history.pushState({}, '', url);
        updateUrlParams();
        const searchInput = document.getElementById('search-input');
        if (searchInput) searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        currentPage = 1;
        loadProducts();
    });
}

function isAuthenticated() {
    return document.body.classList.contains('user-authenticated');
}

function showNotification(message) {
    const notification = document.createElement('div');
    notification.className = 'notification';
    notification.textContent = message;
    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 3000);
}

function updateCartCount() {
    fetch('/api/cart/')
        .then(response => response.json())
        .then(data => {
            const count = data.total_items || 0;
            const cartCount = document.getElementById('cart-count');
            if (cartCount) cartCount.textContent = count;
        })
        .catch(error => console.error('Error:', error));
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function getCurrentCartQuantityForVariant(productId, variantId) {
    try {
        const response = await fetch('/api/cart/');
        if (!response.ok) return 0;
        const cart = await response.json();
        const cartItem = cart.items?.find(item => item.product === productId && item.variant === variantId);
        return cartItem ? cartItem.quantity : 0;
    } catch (error) {
        console.error('Error getting cart quantity:', error);
        return 0;
    }
}

async function getCurrentCartQuantity(productId) {
    try {
        const response = await fetch('/api/cart/');
        if (!response.ok) return 0;
        const cart = await response.json();
        const cartItem = cart.items?.find(item => item.product === productId);
        return cartItem ? cartItem.quantity : 0;
    } catch (error) {
        console.error('Error getting cart quantity:', error);
        return 0;
    }
}

async function openQuantityModal(productId, availableQty) {
    qtyModalProductId = productId;
    qtyModalAvailableQty = availableQty;
    qtyModalCurrentInCart = await getCurrentCartQuantity(productId);
    
    const availableToAdd = Math.max(0, availableQty - qtyModalCurrentInCart);

    const modal = document.getElementById('quantity-modal');
    const qtyInput = document.getElementById('modal-qty-value');
    const stockInfo = document.getElementById('qty-stock-info');

    qtyInput.value = 1;
    qtyInput.max = availableToAdd;

    qtyInput.oninput = function() {
        let val = parseInt(this.value);
        if (isNaN(val) || val < 1) {
            this.value = 1;
        }
        if (val > availableToAdd) {
            this.value = availableToAdd;
            showNotification(`Можно добавить не более ${availableToAdd} шт.`);
        }
    };

    if (availableToAdd <= 0) {
        stockInfo.innerHTML = `<span style="color:red;">В корзине уже максимальное количество (${availableQty} шт.)</span>`;
        qtyInput.disabled = true;
        document.getElementById('confirm-add-to-cart-qty').disabled = true;
    } else {
        stockInfo.innerHTML = `
            <span style="color:green;">В наличии: ${availableQty} шт.</span>
            ${qtyModalCurrentInCart > 0 ? `<br><span style="color:orange;">Уже в корзине: ${qtyModalCurrentInCart} шт. (можно добавить ещё ${availableToAdd})</span>` : ''}
        `;
        qtyInput.disabled = false;
        document.getElementById('confirm-add-to-cart-qty').disabled = false;
    }

    modal.classList.add('active');
}

function closeQuantityModal() {
    const modal = document.getElementById('quantity-modal');
    if (modal) modal.classList.remove('active');
    qtyModalProductId = null;
    qtyModalAvailableQty = 0;
    qtyModalCurrentInCart = 0;
}

async function openSizeModal(productId, variantsJson) {
    sizeModalProductId = productId;
    const variants = JSON.parse(variantsJson);
    sizeModalVariants = variants;
    sizeModalSelectedVariant = null;
    
    const container = document.getElementById('size-options');
    if (container) {
        let html = '';
        for (const variant of variants) {
            const cartQty = await getCurrentCartQuantityForVariant(productId, variant.id);
            const isOutOfStock = variant.available_quantity <= 0;
            const availableToAdd = Math.max(0, variant.available_quantity - cartQty);
            const stockText = isOutOfStock ? ' (нет в наличии)' : 
                (cartQty > 0 ? ` (в корзине: ${cartQty}, можно добавить: ${availableToAdd})` : ` (${variant.available_quantity} шт.)`);
            
            html += `<button class="size-btn" data-variant-id="${variant.id}" 
                           data-size="${variant.size}" 
                           data-available-qty="${variant.available_quantity}"
                           data-cart-qty="${cartQty}"
                           data-available-to-add="${availableToAdd}"
                           ${isOutOfStock ? 'disabled' : ''}>
                        ${variant.size}${stockText}
                    </button>`;
        }
        container.innerHTML = html;
        
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.onclick = async function() {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                sizeModalSelectedVariant = {
                    id: parseInt(this.dataset.variantId),
                    size: this.dataset.size,
                    available_quantity: parseInt(this.dataset.availableQty),
                    cartQty: parseInt(this.dataset.cartQty) || 0,
                    availableToAdd: parseInt(this.dataset.availableToAdd) || 0
                };
                
                const stockInfo = document.getElementById('stock-info');
                if (stockInfo) {
                    stockInfo.innerHTML = `
                        <span style="color: green;">В наличии: ${sizeModalSelectedVariant.available_quantity} шт.</span>
                        ${sizeModalSelectedVariant.cartQty > 0 ? 
                            `<br><span style="color: orange;">Уже в корзине: ${sizeModalSelectedVariant.cartQty} шт. (можно добавить ещё ${sizeModalSelectedVariant.availableToAdd})</span>` : ''}
                    `;
                }
                
                const quantityInput = document.getElementById('modal-quantity');
                if (quantityInput) {
                    quantityInput.max = sizeModalSelectedVariant.availableToAdd;
                    quantityInput.value = 1;
                    
                    quantityInput.oninput = function() {
                        let val = parseInt(this.value);
                        if (isNaN(val) || val < 1) {
                            this.value = 1;
                            val = 1;
                        }
                        if (val > sizeModalSelectedVariant.availableToAdd) {
                            this.value = sizeModalSelectedVariant.availableToAdd;
                            showNotification(`Можно добавить не более ${sizeModalSelectedVariant.availableToAdd} шт.`);
                        }
                    };
                }
            };
        });
    }
    
    document.getElementById('size-modal').classList.add('active');
}

function closeSizeModal() {
    document.getElementById('size-modal').classList.remove('active');
    sizeModalProductId = null;
    sizeModalSelectedVariant = null;
    sizeModalVariants = [];
    sizeModalSelectedSize = null;
    sizeModalSizes = [];
    sizeModalCurrentInCart = 0;
}

function buildUrl() {
    let url = '/api/products/?';
    const params = [];
    const searchQuery = urlParams.get('search');
    if (searchQuery) params.push(`search=${encodeURIComponent(searchQuery)}`);
    
    const collection = document.getElementById('filter-collection').value;
    if (collection && collection !== 'all') {
        params.push(`collection_slug=${collection}`);
    } else if (currentCollectionSlug && !collection) {
        params.push(`collection_slug=${currentCollectionSlug}`);
    }
    
    const category = document.getElementById('filter-category').value;
    if (category) params.push(`category=${category}`);
    
    const silverType = document.getElementById('filter-silver-type').value;
    if (silverType) params.push(`silver_type=${silverType}`);
    
    const fineness = document.getElementById('filter-fineness').value;
    if (fineness) params.push(`fineness=${fineness}`);
    
    let priceMin = document.getElementById('price-min').value;
    let priceMax = document.getElementById('price-max').value;
    if (priceMin && parseFloat(priceMin) < 0) priceMin = 0;
    if (priceMax && parseFloat(priceMax) < 0) priceMax = 0;
    if (priceMin) params.push(`price_min=${priceMin}`);
    if (priceMax) params.push(`price_max=${priceMax}`);
    
    const stones = document.getElementById('filter-stones').value;
    if (stones === 'true') params.push(`stones=true`);
    if (stones === 'false') params.push(`stones=false`);
    
    const stoneType = document.getElementById('filter-stone-type').value;
    if (stoneType) params.push(`stone_type=${stoneType}`);
    
    const discount = document.getElementById('filter-discount').value;
    if (discount === 'true') params.push(`has_discount=true`);
    
    const sort = document.getElementById('sort-select').value;
    params.push(`ordering=${sort}`);
    params.push(`page=${currentPage}`);
    params.push(`page_size=9`);
    
    return url + params.join('&');
}

function initModalButtons() {
    const sizeQtyMinus = document.getElementById('size-qty-minus');
    const sizeQtyPlus = document.getElementById('size-qty-plus');
    const sizeQtyInput = document.getElementById('modal-quantity');

    if (sizeQtyMinus && sizeQtyInput) {
        sizeQtyMinus.addEventListener('click', function(e) {
            e.preventDefault();
            let val = parseInt(sizeQtyInput.value) || 1;
            if (val > 1) {
                sizeQtyInput.value = val - 1;
                sizeQtyInput.dispatchEvent(new Event('input'));
            }
        });
    }

    if (sizeQtyPlus && sizeQtyInput) {
        sizeQtyPlus.addEventListener('click', function(e) {
            e.preventDefault();
            let val = parseInt(sizeQtyInput.value) || 1;
            const maxVal = parseInt(sizeQtyInput.max) || 999;
            if (val < maxVal) {
                sizeQtyInput.value = val + 1;
                sizeQtyInput.dispatchEvent(new Event('input'));
            } else {
                showNotification(`Можно добавить не более ${maxVal} шт.`);
            }
        });
    }
}

function loadFavorites() {
    if (!isAuthenticated()) {
        currentFavorites = [];
        return Promise.resolve([]);
    }
    return fetch('/api/favorites/')
        .then(r => r.json())
        .then(data => {
            currentFavorites = data || [];
            return currentFavorites;
        })
        .catch(() => {
            currentFavorites = [];
            return currentFavorites;
        });
}

function isInFavorites(productId) {
    return currentFavorites.some(f => f.product && f.product.id === productId);
}

function updateFavoritesCount() {
    const favoritesCount = document.getElementById('favorites-count');
    if (favoritesCount) {
        favoritesCount.textContent = currentFavorites.length;
    }
}

function toggleFavoriteInCatalog(productId, event) {
    event.stopPropagation();
    event.preventDefault();
    
    if (!isAuthenticated()) {
        showNotification('Войдите, чтобы добавить в избранное');
        setTimeout(() => {
            window.location.href = '/accounts/login/';
        }, 1500);
        return;
    }
    
    const btn = event.currentTarget;
    const icon = btn.querySelector('i');
    const isActive = icon.style.color === 'rgb(255, 68, 68)' || icon.style.color === '#ff4444';
    
    if (isActive) {
        const favorite = currentFavorites.find(f => f.product && f.product.id === productId);
        if (favorite) {
            fetch(`/api/favorites/${favorite.id}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': getCookie('csrftoken') }
            })
            .then(() => {
                icon.style.color = 'white';
                currentFavorites = currentFavorites.filter(f => f.id !== favorite.id);
                showNotification('Удалено из избранного');
                updateFavoritesCount();
            })
            .catch(error => console.error('Error:', error));
        }
    } else {
        fetch('/api/favorites/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ product_id: productId })
        })
        .then(response => response.json())
        .then(data => {
            icon.style.color = '#ff4444';
            currentFavorites.push(data);
            showNotification('Добавлено в избранное');
            updateFavoritesCount();
        })
        .catch(error => console.error('Error:', error));
    }
}

function renderProductCard(product) {
    const discount = product.discount_percent > 0 ? `<span class="discount-badge">-${product.discount_percent}%</span>` : '';
    const oldPrice = product.old_price ? `<span class="old-price">${product.old_price} ₽</span>` : '';
    const imageUrl = product.image || '/static/shop/images/placeholder.png';
    const rating = product.average_rating || 0;
    const fullStars = Math.round(rating);
    const stars = '★'.repeat(fullStars) + '☆'.repeat(5 - fullStars);
    const variants = product.variants || [];
    const sizes = variants.map(v => v.size);
    const sizesJson = JSON.stringify(sizes).replace(/"/g, '&quot;');
    const variantsJson = JSON.stringify(variants.map(v => ({
        id: v.id,
        size: v.size,
        available_quantity: v.available_quantity
    }))).replace(/"/g, '&quot;');
    const availableQty = product.available_quantity || 0;
    const isOutOfStock = availableQty <= 0;
    
    const isAuth = isAuthenticated();
    const inFav = isAuth ? isInFavorites(product.id) : false;
    const heartColor = inFav ? '#ff4444' : 'white';
    
    const favoriteButton = isAuth ? `
        <button class="favorite-icon-btn" data-product-id="${product.id}" onclick="toggleFavoriteInCatalog(${product.id}, event)">
            <i class="fas fa-heart" style="color: ${heartColor};"></i>
        </button>
    ` : '';
    
    const cartButtonText = isOutOfStock ? 'Нет в наличии' : 'В корзину';
    const cartButtonClass = isOutOfStock ? 'btn-cart disabled' : 'btn-cart';
    
    let cartButtonOnClick = '';
    if (sizes.length > 0) {
        cartButtonOnClick = `openSizeModal(${product.id}, '${variantsJson}')`;
    } else {
        cartButtonOnClick = `openQuantityModal(${product.id}, ${availableQty})`;
    }
    
    return `
        <div class="col-md-4 mb-4">
            <div class="product-card">
                <div class="product-image-wrapper">
                    <a href="/product/${product.id}/" aria-label="Перейти к товару ${escapeHtml(product.name)}">
                        <img src="${imageUrl}" class="product-image" alt="${escapeHtml(product.name)}" onerror="this.src='/static/shop/images/placeholder.png'">
                    </a>
                    ${favoriteButton}
                    ${discount}
                </div>
                <div class="product-info">
                    <div class="product-category">${product.category_name || 'Украшение'}</div>
                    <a href="/product/${product.id}/" class="product-link" aria-label="Подробнее о товаре ${escapeHtml(product.name)}">
                        <div class="product-name">${escapeHtml(product.name)}</div>
                    </a>
                    <div class="rating" aria-label="Рейтинг ${rating} из 5 звезд">
                        <span class="rating-stars" aria-hidden="true">${stars}</span>
                        <span class="text-secondary ms-1">(${product.reviews_count || 0})</span>
                    </div>
                    <div class="product-price">
                        <span class="current-price">${product.price} ₽</span>
                        ${oldPrice ? `<span class="old-price" aria-label="Старая цена ${product.old_price} ₽">${product.old_price} ₽</span>` : ''}
                    </div>
                    <div class="product-sizes">
                        ${sizes.length > 0 ? `Размеры: ${sizes.join(', ')}` : '<span class="text-muted">Без размера</span>'}
                    </div>
                    <button class="${cartButtonClass}" 
                            onclick="event.stopPropagation(); ${cartButtonOnClick}"
                            ${isOutOfStock ? 'disabled' : ''}
                            aria-label="${isOutOfStock ? 'Товар временно отсутствует' : 'Добавить товар в корзину'}">
                        ${cartButtonText}
                    </button>
                </div>
            </div>
        </div>
    `;
}

function loadProducts() {
    const url = buildUrl();
    const container = document.getElementById('products-container');
    container.innerHTML = '<div class="col-12 text-center py-5 text-secondary"><div class="spinner-border text-secondary"></div><p class="mt-2">Загрузка...</p></div>';
    
    if (isAuthenticated()) {
        loadFavorites().then(() => {
            fetchAndRenderProducts(url, container);
        });
    } else {
        fetchAndRenderProducts(url, container);
    }
}

function fetchAndRenderProducts(url, container) {
    fetch(url)
        .then(r => r.json())
        .then(data => {
            const products = data.results || data;
            const totalItems = data.count || products.length;
            totalPages = Math.ceil(totalItems / 9);
            document.getElementById('products-count').textContent = `Найдено товаров: ${totalItems}`;
            
            if (products.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5 text-secondary"><i class="fas fa-search fa-3x mb-3"></i><p>Товаров не найдено</p></div>';
                renderPagination();
                return;
            }
            
            container.innerHTML = '';
            products.forEach(product => {
                container.innerHTML += renderProductCard(product);
            });
            renderPagination();
            window.scrollTo({ top: 400, behavior: 'smooth' });
        })
        .catch(error => {
            console.error('Error:', error);
            container.innerHTML = '<div class="col-12 text-center py-5 text-danger">Ошибка загрузки товаров</div>';
            renderPagination();
        });
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeSizeModal();
        closeQuantityModal();
    }
});
function renderPagination() {
    const container = document.getElementById('pagination');
    if (!container) return;
    if (totalPages <= 0) {
        container.innerHTML = '';
        return;
    }
    
    let html = '';
    if (currentPage > 1) {
        html += `<a href="#" class="page-link" onclick="goToPage(${currentPage - 1}); return false;">← Назад</a>`;
    } else {
        html += `<span class="page-link disabled">← Назад</span>`;
    }
    
    const maxVisible = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
    let endPage = Math.min(totalPages, startPage + maxVisible - 1);
    
    if (endPage - startPage < maxVisible - 1) {
        startPage = Math.max(1, endPage - maxVisible + 1);
    }
    
    if (startPage > 1) {
        html += `<a href="#" class="page-link" onclick="goToPage(1); return false;">1</a>`;
        if (startPage > 2) html += `<span class="page-link disabled">...</span>`;
    }
    
    for (let i = startPage; i <= endPage; i++) {
        html += `<a href="#" class="page-link ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i}); return false;">${i}</a>`;
    }
    
    if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<span class="page-link disabled">...</span>`;
        html += `<a href="#" class="page-link" onclick="goToPage(${totalPages}); return false;">${totalPages}</a>`;
    }
    
    if (currentPage < totalPages) {
        html += `<a href="#" class="page-link" onclick="goToPage(${currentPage + 1}); return false;">Вперед →</a>`;
    } else {
        html += `<span class="page-link disabled">Вперед →</span>`;
    }
    
    container.innerHTML = html;
}

function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    loadProducts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateUrlWithFilters() {
    const url = new URL(window.location.href);
    const collection = document.getElementById('filter-collection').value;
    
    if (collection && collection !== 'all') {
        url.searchParams.set('collection', collection);
    } else {
        url.searchParams.delete('collection');
    }
    
    const searchQuery = urlParams.get('search');
    if (searchQuery) {
        url.searchParams.set('search', searchQuery);
    } else {
        url.searchParams.delete('search');
    }
    
    window.history.pushState({}, '', url);
}

function updateSearchQuery(query) {
    const url = new URL(window.location.href);
    if (query) {
        url.searchParams.set('search', query);
    } else {
        url.searchParams.delete('search');
    }
    window.history.pushState({}, '', url);
    
    const clearBtn = document.getElementById('clear-search');
    if (clearBtn) {
        clearBtn.style.display = query ? 'block' : 'none';
    }
    
    currentPage = 1;
    loadProducts();
}

document.getElementById('apply-filters').addEventListener('click', () => { currentPage = 1; loadProducts(); });
document.getElementById('reset-filters').addEventListener('click', () => {
    document.getElementById('filter-collection').value = '';
    document.getElementById('filter-category').value = '';
    document.getElementById('filter-silver-type').value = '';
    document.getElementById('filter-fineness').value = '';
    document.getElementById('price-min').value = '';
    document.getElementById('price-max').value = '';
    document.getElementById('filter-stones').value = '';
    document.getElementById('filter-stone-type').value = '';
    document.getElementById('filter-discount').value = '';
    document.getElementById('sort-select').value = '-created_at';
    
    const url = new URL(window.location.href);
    url.searchParams.delete('collection');
    url.searchParams.delete('search');
    window.history.pushState({}, '', url);
    
    currentPage = 1;
    currentCollectionSlug = null;
    
    const searchInput = document.getElementById('search-input');
    if (searchInput) searchInput.value = '';
    
    loadProducts();
});

document.addEventListener('DOMContentLoaded', function() {
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.closest('.product-card')) {
            const link = e.target.closest('.product-card').querySelector('a[href^="/product/"]');
            if (link) {
                window.location.href = link.href;
            }
        }
    });
});

document.addEventListener('DOMContentLoaded', function() {
    initModalButtons();
    const filterTitle = document.querySelector('.filter-title');
    const filterContent = document.querySelector('.filter-section');
    
    if (filterTitle && window.innerWidth <= 768) {
        const contentDiv = document.createElement('div');
        contentDiv.className = 'filter-content';
        const children = Array.from(filterContent.children);
        children.forEach(child => {
            if (child !== filterTitle) {
                contentDiv.appendChild(child);
            }
        });
        
        filterContent.appendChild(contentDiv);
        
        filterTitle.addEventListener('click', () => {
            filterTitle.classList.toggle('open');
            contentDiv.classList.toggle('open');
        });
    }
});

document.getElementById('sort-select').addEventListener('change', () => { currentPage = 1; loadProducts(); });

document.getElementById('confirm-add-to-cart').addEventListener('click', async function() {
    const quantity = parseInt(document.getElementById('modal-quantity').value);
    
    if (isNaN(quantity) || quantity < 1) {
        showNotification('Введите корректное количество');
        return;
    }

    if (!sizeModalSelectedVariant) {
        showNotification('Пожалуйста, выберите размер');
        return;
    }
  
    const availableToAdd = sizeModalSelectedVariant.availableToAdd;
    
    if (quantity > availableToAdd) {
        showNotification(`Нельзя добавить ${quantity} шт. Доступно для добавления: ${availableToAdd} шт. (в корзине уже ${sizeModalSelectedVariant.cartQty} из ${sizeModalSelectedVariant.available_quantity})`);
        return;
    }
    
    fetch('/api/cart/add_item/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ 
            variant_id: sizeModalSelectedVariant.id,
            quantity: quantity
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            showNotification(data.error);
        } else {
            closeSizeModal();
            updateCartCount();
            showNotification(`Товар добавлен в корзину!`);
            if (sizeModalSelectedVariant) {
                sizeModalSelectedVariant.cartQty += quantity;
                sizeModalSelectedVariant.availableToAdd = sizeModalSelectedVariant.available_quantity - sizeModalSelectedVariant.cartQty;
            }
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showNotification('Ошибка при добавлении в корзину');
    });
});

const priceMinInput = document.getElementById('price-min');
const priceMaxInput = document.getElementById('price-max');
if (priceMinInput) {
    priceMinInput.addEventListener('input', function() {
        if (this.value && parseFloat(this.value) < 0) this.value = 0;
    });
}
if (priceMaxInput) {
    priceMaxInput.addEventListener('input', function() {
        if (this.value && parseFloat(this.value) < 0) this.value = 0;
    });
}

loadFilterOptions();
loadCategories();
loadCollections();
loadProducts();
</script>
