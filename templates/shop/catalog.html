{% extends 'base.html' %}
{% load static %}

{% block breadcrumb_items %}
<li class="breadcrumb-item active" aria-current="page">Каталог</li>
{% endblock %}

{% block content %}
<style>
    .filter-section {
        background: white;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        position: sticky;
        top: 20px;
    }
    .filter-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 15px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--accent);
    }
    .filter-group {
        margin-bottom: 20px;
    }
    .filter-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--brown);
        margin-bottom: 8px;
        display: block;
    }
    .filter-select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 13px;
        background: white;
        color: var(--brown);
        cursor: pointer;
    }
    .price-inputs {
        display: flex;
        gap: 10px;
        width: 100%;
    }
    .price-inputs input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 13px;
        min-width: 0;
    }
    .page-link.disabled {
        color: var(--gray);
        cursor: not-allowed;
        pointer-events: none;
        background: transparent;
    }
    .btn-apply {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 30px;
        font-size: 14px;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        transition: all 0.3s;
    }
    .btn-apply:hover {
        background: #4a5a6a;
        transform: translateY(-2px);
    }
    .btn-reset {
        background: transparent;
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 14px;
        cursor: pointer;
        width: 100%;
        margin-top: 8px;
        transition: all 0.3s;
    }
    .btn-reset:hover {
        background: var(--accent);
        color: white;
    }
    .products-count {
        font-size: 14px;
        color: var(--gray);
        margin-bottom: 15px;
    }
    .sort-select {
        padding: 10px 20px;
        border: 1px solid #ddd;
        border-radius: 30px;
        font-size: 13px;
        background: white;
        cursor: pointer;
    }
    .product-card {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        transition: transform 0.3s;
        height: 100%;
        position: relative;
    }
    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .product-image-wrapper {
        position: relative;
    }
    .product-image {
        height: 250px;
        object-fit: cover;
        width: 100%;
    }
    .favorite-icon-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0,0,0,0.5);
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s;
        backdrop-filter: blur(4px);
        z-index: 10;
    }
    .favorite-icon-btn:hover {
        transform: scale(1.1);
        background: rgba(0,0,0,0.7);
    }
    .favorite-icon-btn i {
        font-size: 18px;
    }
    .discount-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #ff4444;
        color: white;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        z-index: 10;
    }
    .product-info {
        padding: 15px;
    }
    .product-info a {
        text-decoration: none !important;
        color: inherit;
    }
    .product-category {
        font-size: 11px;
        color: var(--gray);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .product-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--brown);
        margin: 8px 0;
    }
    .product-price {
        font-size: 18px;
        font-weight: 700;
        color: var(--accent);
        margin: 10px 0;
    }
    .old-price {
        font-size: 13px;
        color: var(--gray);
        text-decoration: line-through;
        margin-left: 8px;
        font-weight: normal;
    }
    .rating {
        margin: 8px 0;
    }
    .rating-stars {
        color: #ffc107;
        font-size: 12px;
    }
    .product-sizes {
        font-size: 11px;
        color: var(--gray);
        margin: 8px 0;
    }
    .btn-cart {
        width: 100%;
        padding: 10px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 30px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
    }
    .btn-cart:hover {
        background: #4a5a6a;
        transform: translateY(-2px);
    }
    .pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 30px;
        flex-wrap: wrap;
    }
    .page-link {
        padding: 8px 14px;
        border: 1px solid #ddd;
        border-radius: 30px;
        color: var(--brown);
        text-decoration: none;
        font-size: 13px;
        cursor: pointer;
    }
    .page-link.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    .modal.active {
        display: flex;
    }
    .modal-content {
        background: white;
        border-radius: 24px;
        padding: 30px;
        max-width: 350px;
        width: 90%;
        text-align: center;
    }
    .size-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin: 20px 0;
    }
    .size-btn {
        padding: 10px 20px;
        border: 1px solid var(--accent);
        border-radius: 30px;
        background: white;
        cursor: pointer;
    }
    .size-btn.selected {
        background: var(--accent);
        color: white;
    }
    .notification {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--accent);
        color: var(--bg-cream);
        padding: 12px 24px;
        border-radius: 30px;
        z-index: 1000;
        animation: slideIn 0.3s ease;
    }
    .btn-clear-search {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-clear-search:hover {
        background: #4a5a6a;
        transform: translateY(-2px);
    }
    @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
</style>

<div class="container py-4">
    <div class="row">
        <div class="col-md-3">
            <div class="filter-section">
                <div class="filter-title">Фильтры</div>
                <div class="filter-group">
                    <label class="filter-label">Коллекция</label>
                    <select id="filter-collection" class="filter-select">
                        <option value="">Все коллекции</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Категория</label>
                    <select id="filter-category" class="filter-select">
                        <option value="">Все категории</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Тип серебра</label>
                    <select id="filter-silver-type" class="filter-select">
                        <option value="">Все типы</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Проба</label>
                    <select id="filter-fineness" class="filter-select">
                        <option value="">Все пробы</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Цена (₽)</label>
                    <div class="price-inputs">
                        <input type="number" id="price-min" placeholder="От">
                        <input type="number" id="price-max" placeholder="До">
                    </div>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Камни</label>
                    <select id="filter-stones" class="filter-select">
                        <option value="">Все</option>
                        <option value="true">С камнями</option>
                        <option value="false">Без камней</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Тип камня</label>
                    <select id="filter-stone-type" class="filter-select">
                        <option value="">Любой</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Акция</label>
                    <select id="filter-discount" class="filter-select">
                        <option value="">Все товары</option>
                        <option value="true">Со скидкой</option>
                    </select>
                </div>
                <button class="btn-apply" id="apply-filters">Применить</button>
                <button class="btn-reset" id="reset-filters">Сбросить</button>
            </div>
        </div>
        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <div class="products-count" id="products-count">Загрузка...</div>
                <select class="sort-select" id="sort-select">
                    <option value="-created_at">По новизне</option>
                    <option value="price">Цена (по возрастанию)</option>
                    <option value="-price">Цена (по убыванию)</option>
                    <option value="-average_rating">По популярности</option>
                </select>
                <button id="clear-search" class="btn-clear-search" style="display: none; padding: 10px 20px; border-radius: 30px; background: var(--accent); color: white; border: none; cursor: pointer;">
                    <i class="fas fa-times"></i> Очистить поиск
                </button>
            </div>
            <div class="row" id="products-container">
                <div class="col-12 text-center py-5 text-secondary">Загрузка...</div>
            </div>
            <div id="pagination" class="pagination"></div>
        </div>
    </div>
</div>

<div id="size-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:20px; color:var(--accent);">Выберите размер</h3>
        <div id="size-options" class="size-buttons"></div>
        <div>
            <label>Количество:</label>
            <input type="number" id="modal-quantity" value="1" min="1" style="width:80px; padding:8px; margin-left:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <button id="confirm-add-to-cart" style="margin-top:20px; padding:12px 24px; background:var(--accent); color:white; border:none; border-radius:30px; cursor:pointer;">Добавить в корзину</button>
        <button onclick="closeSizeModal()" style="margin-top:10px; padding:8px 20px; background:transparent; border:none; cursor:pointer;">Отмена</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let totalPages = 1;
let selectedProductId = null;
let selectedProductSizes = [];
let selectedSize = null;
let currentFavorites = [];
let currentCollectionSlug = null;
// Данные для фильтров из моделей
let silverTypes = [];
let finenessChoices = [];
let stoneTypeChoices = [];

// Получение параметра collection из URL
let urlParams = new URLSearchParams(window.location.search);
const collectionSlug = urlParams.get('collection');
// В начале скрипта добавьте:
const searchQuery = urlParams.get('search');

// Показываем кнопку очистки, если есть поисковый запрос
if (searchQuery) {
    const clearBtn = document.getElementById('clear-search');
    if (clearBtn) clearBtn.style.display = 'block';
}

// Обработчик кнопки очистки поиска
// Обработчик кнопки очистки поиска
// Обработчик кнопки очистки поиска
const clearSearchBtn = document.getElementById('clear-search');
if (clearSearchBtn) {
    clearSearchBtn.addEventListener('click', () => {
        // Удаляем параметр search из URL
        const url = new URL(window.location.href);
        url.searchParams.delete('search');
        window.history.pushState({}, '', url);
        
        // Обновляем urlParams
        updateUrlParams();
        
        // Очищаем поле поиска
        const searchInput = document.getElementById('search-input');
        if (searchInput) searchInput.value = '';
        
        // Скрываем кнопку
        clearSearchBtn.style.display = 'none';
        
        // Сбрасываем страницу
        currentPage = 1;
        
        // Перезагружаем товары
        loadProducts();
    });
}

function buildUrl() {
    let url = '/api/products/?';
    const params = [];
    // Используйте глобальный urlParams, а не создавайте новый
    const searchQuery = urlParams.get('search');
    if (searchQuery) params.push(`search=${encodeURIComponent(searchQuery)}`);
    
    const collection = document.getElementById('filter-collection').value;
    if (collection && collection !== 'all') {
        params.push(`collection_slug=${collection}`);
    } else if (currentCollectionSlug && !collection) {
        params.push(`collection_slug=${currentCollectionSlug}`);
    }
    
    const category = document.getElementById('filter-category').value;
    if (category) params.push(`category=${category}`);
    
    const silverType = document.getElementById('filter-silver-type').value;
    if (silverType) params.push(`silver_type=${silverType}`);
    
    const fineness = document.getElementById('filter-fineness').value;
    if (fineness) params.push(`fineness=${fineness}`);
    
    let priceMin = document.getElementById('price-min').value;
    let priceMax = document.getElementById('price-max').value;
    if (priceMin && parseFloat(priceMin) < 0) priceMin = 0;
    if (priceMax && parseFloat(priceMax) < 0) priceMax = 0;
    if (priceMin) params.push(`price_min=${priceMin}`);
    if (priceMax) params.push(`price_max=${priceMax}`);
    
    const stones = document.getElementById('filter-stones').value;
    if (stones === 'true') params.push(`stones=true`);
    if (stones === 'false') params.push(`stones=false`);
    
    const stoneType = document.getElementById('filter-stone-type').value;
    if (stoneType) params.push(`stone_type=${stoneType}`);
    
    const discount = document.getElementById('filter-discount').value;
    if (discount === 'true') params.push(`has_discount=true`);
    
    const sort = document.getElementById('sort-select').value;
    params.push(`ordering=${sort}`);
    params.push(`page=${currentPage}`);
    params.push(`page_size=9`);
    
    return url + params.join('&');
}

// Загрузка коллекций
function loadCollections() {
    fetch('/api/collections/')
        .then(r => r.json())
        .then(data => {
            const select = document.getElementById('filter-collection');
            data.forEach(collection => {
                const option = document.createElement('option');
                option.value = collection.slug;
                option.textContent = collection.name;
                if (collectionSlug === collection.slug) option.selected = true;
                select.appendChild(option);
            });
            if (collectionSlug) loadProducts();
        })
        .catch(e => console.error('Error loading collections:', e));
}

// Загрузка категорий
function loadCategories() {
    fetch('/api/categories/')
        .then(r => r.json())
        .then(data => {
            const select = document.getElementById('filter-category');
            data.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                select.appendChild(option);
            });
        })
        .catch(e => console.error('Error loading categories:', e));
}
// Функция обновления параметров URL
function updateUrlParams() {
    urlParams = new URLSearchParams(window.location.search);
}
// Загрузка фильтров из API

function loadFavorites() {
    if (!isAuthenticated()) {
        currentFavorites = [];
        return Promise.resolve([]);
    }
    
    return fetch('/api/favorites/')
        .then(r => r.json())
        .then(data => {
            currentFavorites = data || [];
            return currentFavorites;
        })
        .catch(() => {
            currentFavorites = [];
            return currentFavorites;
        });
}

function isInFavorites(productId) {
    return currentFavorites.some(f => f.product && f.product.id === productId);
}

function renderProductCard(product) {
    const discount = product.discount_percent > 0 ? `<span class="discount-badge">-${product.discount_percent}%</span>` : '';
    const oldPrice = product.old_price ? `<span class="old-price">${product.old_price} ₽</span>` : '';
    const imageUrl = product.image || '/static/shop/images/placeholder.png';
    const rating = product.average_rating || 0;
    const fullStars = Math.round(rating);
    const stars = '★'.repeat(fullStars) + '☆'.repeat(5 - fullStars);
    const sizes = product.size ? product.size.split(',').map(s => s.trim()) : [];
    const sizesJson = JSON.stringify(sizes).replace(/"/g, '&quot;');
    
    // Проверяем авторизацию для отображения сердечка
    const isAuth = isAuthenticated();
    const inFav = isAuth ? isInFavorites(product.id) : false;
    const heartColor = inFav ? '#ff4444' : 'white';
    
    const favoriteButton = isAuth ? `
        <button class="favorite-icon-btn" data-product-id="${product.id}" onclick="toggleFavoriteInCatalog(${product.id}, event)">
            <i class="fas fa-heart" style="color: ${heartColor};"></i>
        </button>
    ` : '';
    
    return `
        <div class="col-md-4 mb-4">
            <div class="product-card">
                <div class="product-image-wrapper">
                    <a href="/product/${product.id}/">
                        <img src="${imageUrl}" class="product-image" onerror="this.src='/static/shop/images/placeholder.png'">
                    </a>
                    ${favoriteButton}
                    ${discount}
                </div>
                <div class="product-info">
                    <div class="product-category">${product.category_name || 'Украшение'}</div>
                    <a href="/product/${product.id}/">
                        <div class="product-name">${escapeHtml(product.name)}</div>
                    </a>
                    <div class="rating">
                        <span class="rating-stars">${stars}</span>
                        <span class="text-secondary ms-1">(${product.reviews_count || 0})</span>
                    </div>
                    <div class="product-price">
                        ${product.price} ₽ ${oldPrice}
                    </div>
                    <div class="product-sizes">
                        ${sizes.length > 0 ? `Размеры: ${sizes.join(', ')}` : '<span class="text-muted">Без размера</span>'}
                    </div>
                    <button class="btn-cart" data-product-id="${product.id}" data-sizes='${sizesJson}'>В корзину</button>
                </div>
            </div>
        </div>
    `;
}

function loadProducts() {
    const url = buildUrl();
    const container = document.getElementById('products-container');
    container.innerHTML = '<div class="col-12 text-center py-5 text-secondary"><div class="spinner-border text-secondary"></div><p class="mt-2">Загрузка...</p></div>';
    
    // Проверяем авторизацию перед загрузкой избранного
    if (isAuthenticated()) {
        loadFavorites().then(() => {
            fetchAndRenderProducts(url, container);
        });
    } else {
        // Для гостей - загружаем без избранного
        fetchAndRenderProducts(url, container);
    }
}

function fetchAndRenderProducts(url, container) {
    fetch(url)
        .then(r => r.json())
        .then(data => {
            const products = data.results || data;
            const totalItems = data.count || products.length;
            totalPages = Math.ceil(totalItems / 9);
            document.getElementById('products-count').textContent = `Найдено товаров: ${totalItems}`;
            
            if (products.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5 text-secondary"><i class="fas fa-search fa-3x mb-3"></i><p>Товаров не найдено</p></div>';
                renderPagination();
                return;
            }
            
            container.innerHTML = '';
            products.forEach(product => {
                container.innerHTML += renderProductCard(product);
            });
            renderPagination();
            window.scrollTo({ top: 400, behavior: 'smooth' });
        })
        .catch(error => {
            console.error('Error:', error);
            container.innerHTML = '<div class="col-12 text-center py-5 text-danger">Ошибка загрузки товаров</div>';
            renderPagination();
        });
}

function renderPagination() {
    const container = document.getElementById('pagination');
    if (!container) return;
    
    // Всегда показываем пагинацию, даже если totalPages = 0 или 1
    // Но если товаров нет, показываем пустоту
    if (totalPages <= 0) {
        container.innerHTML = '';
        return;
    }
    
    let html = '';
    
    // Кнопка "Назад"
    if (currentPage > 1) {
        html += `<a href="#" class="page-link" onclick="goToPage(${currentPage - 1}); return false;">← Назад</a>`;
    } else {
        html += `<span class="page-link disabled">← Назад</span>`;
    }
    
    // Номера страниц
    const maxVisible = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
    let endPage = Math.min(totalPages, startPage + maxVisible - 1);
    
    if (endPage - startPage < maxVisible - 1) {
        startPage = Math.max(1, endPage - maxVisible + 1);
    }
    
    if (startPage > 1) {
        html += `<a href="#" class="page-link" onclick="goToPage(1); return false;">1</a>`;
        if (startPage > 2) html += `<span class="page-link disabled">...</span>`;
    }
    
    for (let i = startPage; i <= endPage; i++) {
        html += `<a href="#" class="page-link ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i}); return false;">${i}</a>`;
    }
    
    if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<span class="page-link disabled">...</span>`;
        html += `<a href="#" class="page-link" onclick="goToPage(${totalPages}); return false;">${totalPages}</a>`;
    }
    
    // Кнопка "Вперед"
    if (currentPage < totalPages) {
        html += `<a href="#" class="page-link" onclick="goToPage(${currentPage + 1}); return false;">Вперед →</a>`;
    } else {
        html += `<span class="page-link disabled">Вперед →</span>`;
    }
    
    container.innerHTML = html;
}
// Обновление URL при изменении фильтров
function updateUrlWithFilters() {
    const url = new URL(window.location.href);
    const collection = document.getElementById('filter-collection').value;
    
    if (collection && collection !== 'all') {
        url.searchParams.set('collection', collection);
    } else {
        url.searchParams.delete('collection');
    }
    
    // Сохраняем search параметр, если он есть
    const searchQuery = urlParams.get('search');
    if (searchQuery) {
        url.searchParams.set('search', searchQuery);
    } else {
        url.searchParams.delete('search');
    }
    
    window.history.pushState({}, '', url);
}
function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    loadProducts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openSizeModal(productId, sizes) {
    selectedProductId = productId;
    selectedProductSizes = sizes || [];
    selectedSize = null;
    const container = document.getElementById('size-options');
    if (!container) return;
    if (!sizes || sizes.length === 0) {
        container.innerHTML = '<div class="text-secondary">Размер не указан</div>';
    } else {
        let html = '';
        sizes.forEach(size => {
            html += `<button class="size-btn" data-size="${size}">${size}</button>`;
        });
        container.innerHTML = html;
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedSize = this.dataset.size;
            };
        });
    }
    document.getElementById('modal-quantity').value = 1;
    document.getElementById('size-modal').classList.add('active');
}

function closeSizeModal() {
    document.getElementById('size-modal').classList.remove('active');
    selectedProductId = null;
    selectedSize = null;
}
// Функция для обновления URL при поиске (вызывается из base.html)
function updateSearchQuery(query) {
    const url = new URL(window.location.href);
    if (query) {
        url.searchParams.set('search', query);
    } else {
        url.searchParams.delete('search');
    }
    window.history.pushState({}, '', url);
    
    // Показываем/скрываем кнопку очистки
    const clearBtn = document.getElementById('clear-search');
    if (clearBtn) {
        clearBtn.style.display = query ? 'block' : 'none';
    }
    
    // Перезагружаем товары
    currentPage = 1;
    loadProducts();
}

function toggleFavoriteInCatalog(productId, event) {
    event.stopPropagation();
    event.preventDefault();
    
    if (!isAuthenticated()) {
        showNotification('Войдите, чтобы добавить в избранное');
        setTimeout(() => {
            window.location.href = '/accounts/login/';
        }, 1500);
        return;
    }
    
    const btn = event.currentTarget;
    const icon = btn.querySelector('i');
    const isActive = icon.style.color === 'rgb(255, 68, 68)' || icon.style.color === '#ff4444';
    
    if (isActive) {
        const favorite = currentFavorites.find(f => f.product && f.product.id === productId);
        if (favorite) {
            fetch(`/api/favorites/${favorite.id}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': getCookie('csrftoken') }
            })
            .then(() => {
                icon.style.color = 'white';
                currentFavorites = currentFavorites.filter(f => f.id !== favorite.id);
                showNotification('Удалено из избранного');
                if (typeof updateFavoritesCount === 'function') updateFavoritesCount();
            })
            .catch(error => console.error('Error:', error));
        }
    } else {
        fetch('/api/favorites/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ product_id: productId })
        })
        .then(response => response.json())
        .then(data => {
            icon.style.color = '#ff4444';
            currentFavorites.push(data);
            showNotification('Добавлено в избранное');
            if (typeof updateFavoritesCount === 'function') updateFavoritesCount();
        })
        .catch(error => console.error('Error:', error));
    }
}

function updateCartCount() {
    fetch('/api/cart/')
        .then(response => response.json())
        .then(data => {
            const count = data.total_items || 0;
            const cartCount = document.getElementById('cart-count');
            if (cartCount) cartCount.textContent = count;
        })
        .catch(error => console.error('Error:', error));
}

function showNotification(message) {
    const notification = document.createElement('div');
    notification.className = 'notification';
    notification.textContent = message;
    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 2000);
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function updateFavoritesCount() {
    const favoritesCount = document.getElementById('favorites-count');
    if (favoritesCount) {
        favoritesCount.textContent = currentFavorites.length;
    }
}

function isAuthenticated() {
    return document.body.classList.contains('user-authenticated');
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

        alert('Выберите размер');
        return;
    }
    
    fetch('/api/cart/add_item/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({

            size: selectedSize || ''

    .catch(error => console.error('Error:', error));
