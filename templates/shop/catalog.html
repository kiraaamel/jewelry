{% extends 'base.html' %}
{% load static %}

{% block breadcrumb_items %}
<li class="breadcrumb-item active" aria-current="page">Каталог</li>
{% endblock %}

{% block content %}
<style>
    .filter-section {
        background: white;
        border-radius: 1rem;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        position: sticky;
        top: 1.25rem;
    }
    
    .filter-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 0.9375rem;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid var(--accent);
    }
    
    .filter-group {
        margin-bottom: 1.25rem;
    }
    
    .filter-label {
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--brown);
        margin-bottom: 0.5rem;
        display: block;
    }
    
    .filter-select {
        width: 100%;
        padding: 0.625rem 0.75rem;
        border: 1px solid #ddd;
        border-radius: 0.75rem;
        font-size: 0.8125rem;
        background: white;
        color: var(--brown);
        cursor: pointer;
    }
    
    .filter-select:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .price-inputs {
        display: flex;
        gap: 0.625rem;
        width: 100%;
    }
    
    .price-inputs input {
        flex: 1;
        padding: 0.625rem 0.75rem;
        border: 1px solid #ddd;
        border-radius: 0.75rem;
        font-size: 0.8125rem;
        min-width: 0;
    }
    
    .price-inputs input:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .btn-apply {
        background: var(--accent);
        color: white;
        border: none;
        padding: 0.75rem 1.25rem;
        border-radius: 1.875rem;
        font-size: 0.875rem;
        cursor: pointer;
        width: 100%;
        margin-top: 0.625rem;
        transition: all 0.3s;
    }
    
    .btn-apply:hover {
        background: #4a5a6a;
        transform: translateY(-2px);
    }
    
    .btn-apply:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .btn-reset {
        background: transparent;
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 0.625rem 1.25rem;
        border-radius: 1.875rem;
        font-size: 0.875rem;
        cursor: pointer;
        width: 100%;
        margin-top: 0.5rem;
        transition: all 0.3s;
    }
    
    .btn-reset:hover {
        background: var(--accent);
        color: white;
    }
    
    .btn-reset:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .products-count {
        font-size: 0.875rem;
        color: var(--gray);
        margin-bottom: 0.9375rem;
    }
    
    .sort-select {
        padding: 0.625rem 1.25rem;
        border: 1px solid #ddd;
        border-radius: 1.875rem;
        font-size: 0.8125rem;
        background: white;
        cursor: pointer;
    }
    
    .sort-select:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }

    .product-card {
        background: white;
        border-radius: 1.25rem;
        overflow: hidden;
        box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        transition: transform 0.3s, box-shadow 0.3s;
        height: 100%;
        position: relative;
    }
    
    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    
    .product-card:focus-within {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .product-image-wrapper {
        position: relative;
    }
    
    .product-image {
        height: 200px;
        object-fit: cover;
        width: 100%;
    }
    
    .favorite-icon-btn {
        position: absolute;
        top: 0.625rem;
        right: 0.625rem;
        background: rgba(0,0,0,0.5);
        border: none;
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s;
        backdrop-filter: blur(4px);
        z-index: 10;
    }
    
    .favorite-icon-btn:hover {
        transform: scale(1.1);
        background: rgba(0,0,0,0.7);
    }
    
    .favorite-icon-btn:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .favorite-icon-btn i {
        font-size: 1.125rem;
    }
    
    .discount-badge {
        position: absolute;
        top: 0.625rem;
        left: 0.625rem;
        background: #ff4444;
        color: white;
        padding: 0.25rem 0.625rem;
        border-radius: 1.25rem;
        font-size: 0.6875rem;
        font-weight: bold;
        z-index: 10;
    }
    
    .product-info {
        padding: 0.9375rem;
    }
    
    .product-info a {
        text-decoration: none !important;
        color: inherit;
    }
    
    .product-category {
        font-size: 0.6875rem;
        color: var(--gray);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .product-name {
        font-size: 1rem;
        font-weight: 600;
        color: var(--brown);
        margin: 0.5rem 0;
    }
    
    .product-price {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--accent);
        margin: 0.625rem 0;
    }
    
    .old-price {
        font-size: 0.8125rem;
        color: var(--gray);
        text-decoration: line-through;
        margin-left: 0.5rem;
        font-weight: normal;
    }
    
    .rating {
        margin: 0.5rem 0;
    }
    
    .rating-stars {
        color: #ffc107;
        font-size: 0.75rem;
    }
    
    .product-sizes {
        font-size: 0.6875rem;
        color: var(--gray);
        margin: 0.5rem 0;
    }
    
    .btn-cart {
        width: 100%;
        padding: 0.625rem;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 1.875rem;
        font-size: 0.8125rem;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 0.625rem;
    }
    
    .btn-cart:hover:not(.disabled) {
        background: #4a5a6a;
        transform: translateY(-2px);
    }
    
    .btn-cart:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .btn-cart.disabled {
        opacity: 0.5;
        cursor: not-allowed;
        pointer-events: none;
    }

    .pagination {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 1.875rem;
        flex-wrap: wrap;
    }
    
    .page-link {
        padding: 0.5rem 0.875rem;
        border: 1px solid #ddd;
        border-radius: 1.875rem;
        color: var(--brown);
        text-decoration: none;
        font-size: 0.8125rem;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .page-link:hover {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }
    
    .page-link:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }
    
    .page-link.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }
    
    .page-link.disabled {
        color: var(--gray);
        cursor: not-allowed;
        pointer-events: none;
        background: transparent;
    }
    
    .btn-clear-search {
        background: var(--accent);
        color: white;
        border: none;
        padding: 0.625rem 1.25rem;
        border-radius: 1.875rem;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .btn-clear-search:hover {
        background: #4a5a6a;
        transform: translateY(-2px);
    }
    
    .btn-clear-search:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
    }

    @media (max-width: 992px) {
        .filter-section {
            position: static;
            margin-bottom: 1rem;
        }
        
        .product-image {
            height: 150px !important;
        }
    }
 
    @media (max-width: 768px) {
        .filter-section {
            padding: 1rem;
        }
        
        .filter-title {
            font-size: 1rem;
        }
        
        .product-image {
            height: 200px;
        }
        
        .product-name {
            font-size: 0.875rem;
        }
        
        .product-price {
            font-size: 1rem;
        }
        
        .btn-cart,
        .btn-apply,
        .btn-reset {
            font-size: 0.75rem;
        }
    }
    
    @media (max-width: 576px) {
        .filter-section {
            position: static;
            margin-bottom: 1rem;
            cursor: pointer;
        }
        
        .filter-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 0;
        }
        
        .filter-title::after {
            content: "▼";
            font-size: 0.75rem;
            transition: transform 0.3s;
        }
        
        .filter-title.open::after {
            transform: rotate(180deg);
        }
        
        .filter-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .filter-content.open {
            max-height: 500px;
        }
        
        .filter-group {
            margin-bottom: 0;
        }
        .products-count {
            font-size: 0.75rem;
        }
        
        .sort-select {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
        }
        
        .product-image {
            height: 180px;
        }
        
        .product-info {
            padding: 0.75rem;
        }
        
        .product-name {
            font-size: 0.8125rem;
            margin: 0.375rem 0;
        }
        
        .product-category {
            font-size: 0.625rem;
        }
        
        .product-price {
            font-size: 0.9375rem;
            margin: 0.5rem 0;
        }
        
        .rating-stars {
            font-size: 0.6875rem;
        }
        
        .product-sizes {
            font-size: 0.625rem;
        }
        
        .btn-cart {
            padding: 0.5rem;
            font-size: 0.6875rem;
        }
        
        .favorite-icon-btn {
            width: 1.875rem;
            height: 1.875rem;
        }
        
        .favorite-icon-btn i {
            font-size: 0.875rem;
        }
        
        .discount-badge {
            font-size: 0.625rem;
            padding: 0.1875rem 0.5rem;
        }
        
        .page-link {
            padding: 0.375rem 0.625rem;
            font-size: 0.75rem;
        }
        
        .btn-clear-search {
            padding: 0.5rem 0.875rem;
            font-size: 0.75rem;
        }
    }

    @media (max-width: 426px) {
        .product-image {
            height: 160px;
        }
        
        .product-name {
            font-size: 0.75rem;
        }
        
        .product-price {
            font-size: 0.875rem;
        }
        
        .product-category {
            font-size: 0.5625rem;
        }
    }
    
    @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
</style>

{% block scripts %}
<script>
let currentPage = 1;
let totalPages = 1;
let selectedProductId = null;
let selectedProductSizes = [];
let selectedSize = null;
let currentFavorites = [];
let currentCollectionSlug = null;
let selectedAvailableQty = 0;
let silverTypes = [];
let finenessChoices = [];
let stoneTypeChoices = [];

let sizeModalProductId = null;
let sizeModalSizes = [];
let sizeModalSelectedSize = null;
let sizeModalAvailableQty = 0;
let sizeModalCurrentInCart = 0;

let qtyModalProductId = null;
let qtyModalAvailableQty = 0;
let qtyModalCurrentInCart = 0;

let urlParams = new URLSearchParams(window.location.search);
const collectionSlug = urlParams.get('collection');
const searchQuery = urlParams.get('search');

if (searchQuery) {
    const clearBtn = document.getElementById('clear-search');
    if (clearBtn) clearBtn.style.display = 'block';
}

const clearSearchBtn = document.getElementById('clear-search');
if (clearSearchBtn) {
    clearSearchBtn.addEventListener('click', () => {
        const url = new URL(window.location.href);
        url.searchParams.delete('search');
        window.history.pushState({}, '', url);
        updateUrlParams();
        const searchInput = document.getElementById('search-input');
        if (searchInput) searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        currentPage = 1;
        loadProducts();
    });
}

function isAuthenticated() {
    return document.body.classList.contains('user-authenticated');
}

function showNotification(message) {
    const notification = document.createElement('div');
    notification.className = 'notification';
    notification.textContent = message;
    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 3000);
}

function updateCartCount() {
    fetch('/api/cart/')
        .then(response => response.json())
        .then(data => {
            const count = data.total_items || 0;
            const cartCount = document.getElementById('cart-count');
            if (cartCount) cartCount.textContent = count;
        })
        .catch(error => console.error('Error:', error));
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function getCurrentCartQuantity(productId) {
    try {
        const response = await fetch('/api/cart/');
        if (!response.ok) return 0;
        const cart = await response.json();
        const cartItem = cart.items?.find(item => item.product === productId);
        return cartItem ? cartItem.quantity : 0;
    } catch (error) {
        console.error('Error getting cart quantity:', error);
        return 0;
    }
}

async function getCurrentCartQuantityForSize(productId, size) {
    try {
        const response = await fetch('/api/cart/');
        if (!response.ok) return 0;
        const cart = await response.json();
        const cartItem = cart.items?.find(item => item.product === productId && item.size === size);
        return cartItem ? cartItem.quantity : 0;
    } catch (error) {
        console.error('Error getting cart quantity:', error);
        return 0;
    }
}

                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;

            }

                width: 90%;
                text-align: center;
                position: relative;
            }
            #quantity-modal .modal-close {
                position: absolute;
                top: 15px;
                right: 20px;
                font-size: 24px;
                cursor: pointer;
                color: var(--gray);
            }
        `;
        document.head.appendChild(style);
    }
    
    const qtyInput = document.getElementById('modal-qty-value');
    const minusBtn = document.getElementById('qty-minus');
    const plusBtn = document.getElementById('qty-plus');
    
    if (minusBtn) {
        minusBtn.addEventListener('click', () => {
            let val = parseInt(qtyInput.value) || 1;
            if (val > 1) {
                qtyInput.value = val - 1;
            }
        });
    }
    
    if (plusBtn) {
        plusBtn.addEventListener('click', () => {
            let val = parseInt(qtyInput.value) || 1;
            const remainingToAdd = Math.max(0, qtyModalAvailableQty - qtyModalCurrentInCart);

            if (val < remainingToAdd) {
                qtyInput.value = val + 1;
            } else {
                showNotification(`Можно добавить только ${remainingToAdd} шт.`);
            }
        });
    }
    
    document.getElementById('confirm-add-to-cart-qty').addEventListener('click', function() {
        const quantity = parseInt(document.getElementById('modal-qty-value').value);
        const totalAfterAdd = qtyModalCurrentInCart + quantity;
        
        if (totalAfterAdd > qtyModalAvailableQty) {
            const remaining = Math.max(0, qtyModalAvailableQty - qtyModalCurrentInCart);

            showNotification(
                `В корзине уже ${qtyModalCurrentInCart} шт. Доступно для добавления: ${remaining} шт.`
            );
            return;
        }
        
        if (quantity > qtyModalAvailableQty) {
            showNotification(`Доступно только ${qtyModalAvailableQty} шт.`);
            return;
        }
        
        fetch('/api/cart/add_item/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                product_id: qtyModalProductId,
                quantity: quantity,
                size: ''
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                showNotification(data.error);
            } else {
                closeQuantityModal();
                updateCartCount();
                showNotification(`Товар добавлен в корзину! (теперь в корзине ${qtyModalCurrentInCart + quantity} шт.)`);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showNotification('Ошибка при добавлении в корзину');
        });
    });
}

async function openSizeModal(productId, sizesJson, availableQty) {

    sizeModalAvailableQty = availableQty;
    sizeModalCurrentInCart = 0;

        for (const size of sizeModalSizes) {
            const cartQty = await getCurrentCartQuantityForSize(productId, size);
            let stockText = '';

                stockText = ` <span style="font-size: 10px; color: orange;">(в корзине: ${cartQty})</span>`;
            }
            html += `<button class="size-btn" data-size="${size}" data-cart-qty="${cartQty}">${size}${stockText}</button>`;
        }
        container.innerHTML = html;
        
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.onclick = async function() {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                sizeModalSelectedSize = this.dataset.size;
                const cartQty = parseInt(this.dataset.cartQty) || 0;
                sizeModalCurrentInCart = cartQty;
                
                const stockInfo = document.getElementById('stock-info');
                if (stockInfo) {
                    const totalInStock = sizeModalAvailableQty;
                    const canAddMore = Math.max(0, totalInStock - cartQty);
                    
                    let infoHtml = `<span style="color: green;">В наличии ${totalInStock} шт.</span>`;
                    
                    if (cartQty > 0) {
                        const remainingToAdd = Math.max(0, totalInStock - cartQty);
                        infoHtml += `<br><span style="color: orange;">Уже в корзине: ${cartQty} шт. (можно добавить ещё ${remainingToAdd} шт.)</span>`;
                        
                        if (cartQty >= totalInStock) {
                            infoHtml += `<br><span style="color: red;">Вы добавили максимальное количество этого размера</span>`;
                            document.getElementById('confirm-add-to-cart').disabled = true;
                        } else {
                            document.getElementById('confirm-add-to-cart').disabled = false;
                        }
                    } else {
                        document.getElementById('confirm-add-to-cart').disabled = false;
                    }
                    stockInfo.innerHTML = infoHtml;
                }
                
                const quantityInput = document.getElementById('modal-quantity');
                if (quantityInput) {
                    const maxQty = sizeModalAvailableQty;
                    quantityInput.max = maxQty;
                    quantityInput.value = 0;
                }
            };
        });
    }
    
    const stockInfo = document.getElementById('stock-info');
    if (stockInfo) {
        if (sizeModalAvailableQty <= 0) {
            stockInfo.innerHTML = '<span style="color: red;">Нет в наличии</span>';
            document.getElementById('confirm-add-to-cart').disabled = true;
        } else {
            stockInfo.innerHTML = `<span style="color: green;">Выберите размер</span>`;
            document.getElementById('confirm-add-to-cart').disabled = true;
        }
    }
    
    const quantityInput = document.getElementById('modal-quantity');
    if (quantityInput) {
        quantityInput.max = Math.max(0, qtyModalAvailableQty - qtyModalCurrentInCart);
        quantityInput.value = 0;
    }
    
    document.getElementById('size-modal').classList.add('active');
}

function buildUrl() {
    let url = '/api/products/?';
    const params = [];
    const searchQuery = urlParams.get('search');
    if (searchQuery) params.push(`search=${encodeURIComponent(searchQuery)}`);
    
    const collection = document.getElementById('filter-collection').value;
    if (collection && collection !== 'all') {
        params.push(`collection_slug=${collection}`);
    } else if (currentCollectionSlug && !collection) {
        params.push(`collection_slug=${currentCollectionSlug}`);
    }
    
    const category = document.getElementById('filter-category').value;
    if (category) params.push(`category=${category}`);
    
    const silverType = document.getElementById('filter-silver-type').value;
    if (silverType) params.push(`silver_type=${silverType}`);
    
    const fineness = document.getElementById('filter-fineness').value;
    if (fineness) params.push(`fineness=${fineness}`);
    
    let priceMin = document.getElementById('price-min').value;
    let priceMax = document.getElementById('price-max').value;
    if (priceMin && parseFloat(priceMin) < 0) priceMin = 0;
    if (priceMax && parseFloat(priceMax) < 0) priceMax = 0;
    if (priceMin) params.push(`price_min=${priceMin}`);
    if (priceMax) params.push(`price_max=${priceMax}`);
    
    const stones = document.getElementById('filter-stones').value;
    if (stones === 'true') params.push(`stones=true`);
    if (stones === 'false') params.push(`stones=false`);
    
    const stoneType = document.getElementById('filter-stone-type').value;
    if (stoneType) params.push(`stone_type=${stoneType}`);
    
    const discount = document.getElementById('filter-discount').value;
    if (discount === 'true') params.push(`has_discount=true`);
    
    const sort = document.getElementById('sort-select').value;
    params.push(`ordering=${sort}`);
    params.push(`page=${currentPage}`);
    params.push(`page_size=9`);
    
    return url + params.join('&');
}

function loadFavorites() {
    if (!isAuthenticated()) {
        currentFavorites = [];
        return Promise.resolve([]);
    }
    return fetch('/api/favorites/')
        .then(r => r.json())
        .then(data => {
            currentFavorites = data || [];
            return currentFavorites;
        })
        .catch(() => {
            currentFavorites = [];
            return currentFavorites;
        });
}

function isInFavorites(productId) {
    return currentFavorites.some(f => f.product && f.product.id === productId);
}

function updateFavoritesCount() {
    const favoritesCount = document.getElementById('favorites-count');
    if (favoritesCount) {
        favoritesCount.textContent = currentFavorites.length;
    }
}

function toggleFavoriteInCatalog(productId, event) {
    event.stopPropagation();
    event.preventDefault();
    
    if (!isAuthenticated()) {
        showNotification('Войдите, чтобы добавить в избранное');
        setTimeout(() => {
            window.location.href = '/accounts/login/';
        }, 1500);
        return;
    }
    
    const btn = event.currentTarget;
    const icon = btn.querySelector('i');
    const isActive = icon.style.color === 'rgb(255, 68, 68)' || icon.style.color === '#ff4444';
    
    if (isActive) {
        const favorite = currentFavorites.find(f => f.product && f.product.id === productId);
        if (favorite) {
            fetch(`/api/favorites/${favorite.id}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': getCookie('csrftoken') }
            })
            .then(() => {
                icon.style.color = 'white';
                currentFavorites = currentFavorites.filter(f => f.id !== favorite.id);
                showNotification('Удалено из избранного');
                updateFavoritesCount();
            })
            .catch(error => console.error('Error:', error));
        }
    } else {
        fetch('/api/favorites/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ product_id: productId })
        })
        .then(response => response.json())
        .then(data => {
            icon.style.color = '#ff4444';
            currentFavorites.push(data);
            showNotification('Добавлено в избранное');
            updateFavoritesCount();
        })
        .catch(error => console.error('Error:', error));
    }
}

function renderProductCard(product) {
    const discount = product.discount_percent > 0 ? `<span class="discount-badge">-${product.discount_percent}%</span>` : '';
    const oldPrice = product.old_price ? `<span class="old-price">${product.old_price} ₽</span>` : '';
    const imageUrl = product.image || '/static/shop/images/placeholder.png';
    const rating = product.average_rating || 0;
    const fullStars = Math.round(rating);
    const stars = '★'.repeat(fullStars) + '☆'.repeat(5 - fullStars);
    const sizes = product.size ? product.size.split(',').map(s => s.trim()) : [];
    const sizesJson = JSON.stringify(sizes).replace(/"/g, '&quot;');
    const availableQty = product.available_quantity || 0;
    const isOutOfStock = availableQty <= 0;
    
    const isAuth = isAuthenticated();
    const inFav = isAuth ? isInFavorites(product.id) : false;
    const heartColor = inFav ? '#ff4444' : 'white';
    
    const favoriteButton = isAuth ? `
        <button class="favorite-icon-btn" data-product-id="${product.id}" onclick="toggleFavoriteInCatalog(${product.id}, event)">
            <i class="fas fa-heart" style="color: ${heartColor};"></i>
        </button>
    ` : '';
    
    const cartButtonText = isOutOfStock ? 'Нет в наличии' : 'В корзину';
    const cartButtonClass = isOutOfStock ? 'btn-cart disabled' : 'btn-cart';
    
    let cartButtonOnClick = '';
    if (sizes.length > 0) {
        cartButtonOnClick = `openSizeModal(${product.id}, '${sizesJson}', ${availableQty})`;
    } else {
        cartButtonOnClick = `openQuantityModal(${product.id}, ${availableQty})`;
    }
    
    return `
        <div class="col-md-4 mb-4">
            <div class="product-card">
                <div class="product-image-wrapper">
                    <a href="/product/${product.id}/">
                        <img src="${imageUrl}" class="product-image" onerror="this.src='/static/shop/images/placeholder.png'">
                    </a>
                    ${favoriteButton}
                    ${discount}
                </div>
                <div class="product-info">
                    <div class="product-category">${product.category_name || 'Украшение'}</div>
                    <a href="/product/${product.id}/">
                        <div class="product-name">${escapeHtml(product.name)}</div>
                    </a>
                    <div class="rating">
                        <span class="rating-stars">${stars}</span>
                        <span class="text-secondary ms-1">(${product.reviews_count || 0})</span>
                    </div>
                    <div class="product-price">
                        ${product.price} ₽ ${oldPrice}
                    </div>
                    <div class="product-sizes">
                        ${sizes.length > 0 ? `Размеры: ${sizes.join(', ')}` : '<span class="text-muted">Без размера</span>'}
                    </div>
                    <button class="${cartButtonClass}" 
                            onclick="event.stopPropagation(); ${cartButtonOnClick}"
                            ${isOutOfStock ? 'disabled' : ''}>
                        ${cartButtonText}
                    </button>
                </div>
            </div>
        </div>
    `;
}

function loadProducts() {
    const url = buildUrl();
    const container = document.getElementById('products-container');
    container.innerHTML = '<div class="col-12 text-center py-5 text-secondary"><div class="spinner-border text-secondary"></div><p class="mt-2">Загрузка...</p></div>';
    
    if (isAuthenticated()) {
        loadFavorites().then(() => {
            fetchAndRenderProducts(url, container);
        });
    } else {
        fetchAndRenderProducts(url, container);
    }
}

function fetchAndRenderProducts(url, container) {
    fetch(url)
        .then(r => r.json())
        .then(data => {
            const products = data.results || data;
            const totalItems = data.count || products.length;
            totalPages = Math.ceil(totalItems / 9);
            document.getElementById('products-count').textContent = `Найдено товаров: ${totalItems}`;
            
            if (products.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5 text-secondary"><i class="fas fa-search fa-3x mb-3"></i><p>Товаров не найдено</p></div>';
                renderPagination();
                return;
            }
            
            container.innerHTML = '';
            products.forEach(product => {
                container.innerHTML += renderProductCard(product);
            });
            renderPagination();
            window.scrollTo({ top: 400, behavior: 'smooth' });
        })
        .catch(error => {
            console.error('Error:', error);
            container.innerHTML = '<div class="col-12 text-center py-5 text-danger">Ошибка загрузки товаров</div>';
            renderPagination();
        });
}

function renderPagination() {
    const container = document.getElementById('pagination');
    if (!container) return;
    if (totalPages <= 0) {
        container.innerHTML = '';
        return;
    }
    
    let html = '';
    if (currentPage > 1) {
        html += `<a href="#" class="page-link" onclick="goToPage(${currentPage - 1}); return false;">← Назад</a>`;
    } else {
        html += `<span class="page-link disabled">← Назад</span>`;
    }
    
    const maxVisible = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
    let endPage = Math.min(totalPages, startPage + maxVisible - 1);
    
    if (endPage - startPage < maxVisible - 1) {
        startPage = Math.max(1, endPage - maxVisible + 1);
    }
    
    if (startPage > 1) {
        html += `<a href="#" class="page-link" onclick="goToPage(1); return false;">1</a>`;
        if (startPage > 2) html += `<span class="page-link disabled">...</span>`;
    }
    
    for (let i = startPage; i <= endPage; i++) {
        html += `<a href="#" class="page-link ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i}); return false;">${i}</a>`;
    }
    
    if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<span class="page-link disabled">...</span>`;
        html += `<a href="#" class="page-link" onclick="goToPage(${totalPages}); return false;">${totalPages}</a>`;
    }
    
    if (currentPage < totalPages) {
        html += `<a href="#" class="page-link" onclick="goToPage(${currentPage + 1}); return false;">Вперед →</a>`;
    } else {
        html += `<span class="page-link disabled">Вперед →</span>`;
    }
    
    container.innerHTML = html;
}

function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    loadProducts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateUrlWithFilters() {
    const url = new URL(window.location.href);
    const collection = document.getElementById('filter-collection').value;
    
    if (collection && collection !== 'all') {
        url.searchParams.set('collection', collection);
    } else {
        url.searchParams.delete('collection');
    }
    
    const searchQuery = urlParams.get('search');
    if (searchQuery) {
        url.searchParams.set('search', searchQuery);
    } else {
        url.searchParams.delete('search');
    }
    
    window.history.pushState({}, '', url);
}

function updateSearchQuery(query) {
    const url = new URL(window.location.href);
    if (query) {
        url.searchParams.set('search', query);
    } else {
        url.searchParams.delete('search');
    }
    window.history.pushState({}, '', url);
    
    const clearBtn = document.getElementById('clear-search');
    if (clearBtn) {
        clearBtn.style.display = query ? 'block' : 'none';
    }
    
    currentPage = 1;
    loadProducts();
}

document.getElementById('apply-filters').addEventListener('click', () => { currentPage = 1; loadProducts(); });
document.getElementById('reset-filters').addEventListener('click', () => {
    document.getElementById('filter-collection').value = '';
    document.getElementById('filter-category').value = '';
    document.getElementById('filter-silver-type').value = '';
    document.getElementById('filter-fineness').value = '';
    document.getElementById('price-min').value = '';
    document.getElementById('price-max').value = '';
    document.getElementById('filter-stones').value = '';
    document.getElementById('filter-stone-type').value = '';
    document.getElementById('filter-discount').value = '';
    document.getElementById('sort-select').value = '-created_at';
    
    const url = new URL(window.location.href);
    url.searchParams.delete('collection');
    url.searchParams.delete('search');
    window.history.pushState({}, '', url);
    
    currentPage = 1;
    currentCollectionSlug = null;
    
    const searchInput = document.getElementById('search-input');
    if (searchInput) searchInput.value = '';
    
    loadProducts();
});

document.addEventListener('DOMContentLoaded', function() {
    // Добавляем обработку Enter для карточек
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.closest('.product-card')) {
            const link = e.target.closest('.product-card').querySelector('a[href^="/product/"]');
            if (link) {
                window.location.href = link.href;
            }
        }
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const filterTitle = document.querySelector('.filter-title');
    const filterContent = document.querySelector('.filter-section');
    
    if (filterTitle && window.innerWidth <= 768) {
        const contentDiv = document.createElement('div');
        contentDiv.className = 'filter-content';
        const children = Array.from(filterContent.children);
        children.forEach(child => {
            if (child !== filterTitle) {
                contentDiv.appendChild(child);
            }
        });
        
        filterContent.appendChild(contentDiv);
        
        filterTitle.addEventListener('click', () => {
            filterTitle.classList.toggle('open');
            contentDiv.classList.toggle('open');
        });
    }
});

document.getElementById('sort-select').addEventListener('change', () => { currentPage = 1; loadProducts(); });

document.getElementById('confirm-add-to-cart').addEventListener('click', async function() {
    const quantity = parseInt(document.getElementById('modal-quantity').value);
    
    if (sizeModalSizes.length > 0 && !sizeModalSelectedSize) {
        alert('Выберите размер');
        return;
    }

    const currentCartQty = await getCurrentCartQuantityForSize(sizeModalProductId, sizeModalSelectedSize);
    const maxAvailable = sizeModalAvailableQty;

    if (currentCartQty >= maxAvailable) {
        showNotification(`В корзине уже максимальное количество (${currentCartQty} шт.)`);
        return;
    }
    
    const remainingToAdd = Math.max(0, maxAvailable - currentCartQty);
    
    if (quantity > remainingToAdd) {
        showNotification(`Можно добавить не более ${remainingToAdd} шт.`);
        return;
    }
    
    fetch('/api/cart/add_item/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ 
            product_id: sizeModalProductId, 
            quantity: quantity,
            size: sizeModalSelectedSize || '' 
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            showNotification(data.error);
        } else {
            closeSizeModal();
            updateCartCount();
            showNotification(`Товар добавлен в корзину! (теперь в корзине ${currentCartQty + quantity} шт.)`);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showNotification('Ошибка при добавлении в корзину');
    });
});

const priceMinInput = document.getElementById('price-min');
const priceMaxInput = document.getElementById('price-max');
if (priceMinInput) {
    priceMinInput.addEventListener('input', function() {
        if (this.value && parseFloat(this.value) < 0) this.value = 0;
    });
}
if (priceMaxInput) {
    priceMaxInput.addEventListener('input', function() {
        if (this.value && parseFloat(this.value) < 0) this.value = 0;
    });
}

loadFilterOptions();
loadCategories();
loadCollections();
loadProducts();
</script>
